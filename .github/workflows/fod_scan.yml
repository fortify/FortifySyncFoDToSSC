name: Fortify on Demand Scan

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  fortify:
    uses: fortify/shared-github/.github/workflows/reusable-fortify-analysis.yml@5ad1afec0f56a21b03f0887eea35505cb6a66554
    with:
      java-version: '17'
    secrets:
      OSS_FOD_TENANT: ${{ secrets.OSS_FOD_TENANT }}
      OSS_FOD_USER: ${{ secrets.OSS_FOD_USER }}
      OSS_FOD_PAT: ${{ secrets.OSS_FOD_PAT }}
