name: Fortify on Demand Scan

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  fortify:
    uses: fortify/shared-github/.github/workflows/reusable-fortify-analysis.yml@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
    with:
      java-version: '17'
    secrets:
      OSS_FOD_TENANT: ${{ secrets.OSS_FOD_TENANT }}
      OSS_FOD_USER: ${{ secrets.OSS_FOD_USER }}
      OSS_FOD_PAT: ${{ secrets.OSS_FOD_PAT }}
