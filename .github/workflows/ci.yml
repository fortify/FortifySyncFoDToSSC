name: Build and release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-info:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      version: ${{ steps.info.outputs.version }}
      release_tag: ${{ steps.info.outputs.release_tag }}
      docker_tag: ${{ steps.info.outputs.docker_tag }}
      docker_extra_tags: ${{ steps.info.outputs.docker_extra_tags }}
      do_release: ${{ steps.info.outputs.do_release }}
      dev_release: ${{ steps.info.outputs.dev_release }}
      branch: ${{ steps.info.outputs.branch }}
    steps:
      - name: Check out source
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          persist-credentials: false

      - name: Prepare production release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: fortify/shared-github/actions/3rdparty/googleapis/release-please-action/v5@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          release-type: simple
          skip-github-pull-request: true

      - name: Define build and release metadata
        id: info
        shell: bash
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          PROD_TAG: ${{ steps.release.outputs.tag_name }}
          PROD_VERSION: ${{ steps.release.outputs.version }}
          PROD_MAJOR: ${{ steps.release.outputs.major }}
          PROD_MINOR: ${{ steps.release.outputs.minor }}
        run: |
          if [[ "$RELEASE_CREATED" == "true" ]]; then
            {
              echo "version=$PROD_VERSION"
              echo "release_tag=$PROD_TAG"
              echo "docker_tag=$PROD_VERSION"
              echo "docker_extra_tags=latest,stable,v${PROD_VERSION},${PROD_MAJOR}.${PROD_MINOR},v${PROD_MAJOR}.${PROD_MINOR},${PROD_MAJOR},v${PROD_MAJOR}"
              echo "do_release=true"
              echo "dev_release=false"
            } >> "$GITHUB_OUTPUT"
          else
            branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            tag="dev_${branch//[^a-zA-Z0-9_.-]/.}"
            {
              echo "branch=$branch"
              echo "version=0.$(date -u +'%Y%m%d.%H%M%S')-${tag}"
              echo "release_tag=$tag"
              echo "docker_tag=$tag"
              if [[ "$branch" == "main" ]]; then
                echo "docker_extra_tags=latest_rc"
              fi
            } >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              if git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null; then
                echo "do_release=true" >> "$GITHUB_OUTPUT"
                echo "dev_release=true" >> "$GITHUB_OUTPUT"
              else
                status=$?
                if [[ "$status" != "2" ]]; then
                  echo "::error::Unable to check development release tag $tag"
                  exit "$status"
                fi
                echo "Development tag $tag does not exist; building without publishing."
              fi
            fi
          fi

  build:
    runs-on: ubuntu-latest
    needs: release-info
    env:
      RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
    steps:
      - name: Check out source
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          persist-credentials: false

      - name: Set up Java
        uses: fortify/shared-github/actions/3rdparty/actions/setup-java/v5@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and test distributions
        run: ./gradlew --no-daemon clean build dist distThirdParty jibBuildTar "-Pversion=$RELEASE_VERSION"

      - name: Archive test results
        if: always()
        uses: fortify/shared-github/actions/3rdparty/actions/upload-artifact/v7@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      - name: Archive distributions
        uses: fortify/shared-github/actions/3rdparty/actions/upload-artifact/v7@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          name: build_artifacts
          path: build/dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release-info, build]
    if: github.event_name == 'push' && needs.release-info.outputs.do_release == 'true'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
      RELEASE_TAG: ${{ needs.release-info.outputs.release_tag }}
      DOCKER_TAG: ${{ needs.release-info.outputs.docker_tag }}
      DOCKER_EXTRA_TAGS: ${{ needs.release-info.outputs.docker_extra_tags }}
      BRANCH: ${{ needs.release-info.outputs.branch }}
    steps:
      - name: Check out source
        uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          persist-credentials: false

      - name: Set up Java
        uses: fortify/shared-github/actions/3rdparty/actions/setup-java/v5@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download distributions
        uses: fortify/shared-github/actions/3rdparty/actions/download-artifact/v8@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          name: build_artifacts
          path: build/dist

      - name: Publish Docker image
        run: ./gradlew --no-daemon jib "-Pversion=$RELEASE_VERSION" "-PjibImageTag=$DOCKER_TAG" "-PjibExtraImageTags=$DOCKER_EXTRA_TAGS"
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Update development release
        if: needs.release-info.outputs.dev_release == 'true'
        shell: bash
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
            -f "sha=$GITHUB_SHA" -F force=true
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "$RELEASE_TAG" <<< "$releases"; then
            gh release edit "$RELEASE_TAG" --prerelease \
              --title "Development Release - $BRANCH branch"
          else
            gh release create "$RELEASE_TAG" --prerelease \
              --title "Development Release - $BRANCH branch" \
              --notes 'See Assets below for the latest build artifacts.'
          fi

      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" build/dist/*.zip --clobber

  release-pr:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Prepare release PR
        uses: fortify/shared-github/actions/3rdparty/googleapis/release-please-action/v5@15d0b01f3bedb5c1523cb806e745f041e9bce5a3
        with:
          release-type: simple
          skip-github-release: true
